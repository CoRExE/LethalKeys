# Compile LethalKeys et produit le paquet Thunderstore.
#  - push sur main / pull request : build + .zip en artefact du run
#  - push d'un tag vX.Y.Z           : build en version X.Y.Z + release GitHub avec le .zip
#
# Les DLL du jeu ne sont pas disponibles ici : le csproj utilise alors les paquets NuGet
# LethalCompany.GameLibs.Steam / BepInEx.Core / UnityEngine.Modules (UseLocalGameLibs=false).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la release sur un tag

env:
  LETHALCONFIG_VERSION: "1.4.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP '(?<=<Version>)[^<]+' LethalKeys.csproj)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide pour Thunderstore : '$VERSION' (attendu : X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION"

      # Dépendance optionnelle : seulement nécessaire pour compiler (non incluse dans le paquet).
      - name: Télécharger LethalConfig ${{ env.LETHALCONFIG_VERSION }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lethalconfig"
          curl -fsSL "https://thunderstore.io/package/download/AinaVT/LethalConfig/${LETHALCONFIG_VERSION}/" -o "$RUNNER_TEMP/lethalconfig.zip"
          unzip -q "$RUNNER_TEMP/lethalconfig.zip" -d "$RUNNER_TEMP/lethalconfig"
          DLL="$(find "$RUNNER_TEMP/lethalconfig" -name LethalConfig.dll | head -n 1)"
          test -n "$DLL" || { echo "::error::LethalConfig.dll introuvable"; exit 1; }
          echo "LETHALCONFIG_DLL=$DLL" >> "$GITHUB_ENV"

      - name: Build Release
        run: >
          dotnet build LethalKeys.csproj -c Release
          -p:UseLocalGameLibs=false
          -p:Version=${{ steps.version.outputs.version }}
          "-p:LethalConfigDll=${{ env.LETHALCONFIG_DLL }}"

      - uses: actions/upload-artifact@v4
        with:
          name: LethalKeys-${{ steps.version.outputs.version }}
          path: dist/LethalKeys-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LethalKeys-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
